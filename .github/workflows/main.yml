git add .github/workflows/main.yml
   git commit -m "Optimizar keep-alive workflow"
   git push
```

---

## 🎓 ¿Por qué este enfoque funciona mejor?
```
✅ Sigue redirecciones automáticamente (-L)
✅ Timeout de 60 segundos (suficiente para Streamlit)
✅ Reintentos automáticos (--retry 2)
✅ Headers de navegador real (evita detección)
✅ Dos intentos con espera de 45 segundos
✅ Ejecuta cada 10 minutos
✅ 100% gratis (GitHub Actions da 2000 min/mes gratis)
```

---

## ⏰ Frecuencia de ejecución:

Con `cron: '*/10 * * * *'`:
- **144 ejecuciones por día**
- **~2 minutos de uso por día**
- **~60 minutos por mes**
- Muy por debajo del límite de 2000 min/mes de GitHub

---

## 🧪 Probar manualmente:

Después de hacer commit:

1. Ve a tu repo en GitHub
2. Click en **"Actions"**
3. Selecciona el workflow **"Keep Streamlit App Awake"**
4. Click en **"Run workflow"** (botón derecho)
5. Observa los logs en tiempo real

---

## 📊 Monitorear el éxito:

En GitHub Actions verás:
```
✅ App está activa (código: 200)
```

O:
```
⏳ App dormida, esperando...
✅ App despertó exitosamente en segundo intento
