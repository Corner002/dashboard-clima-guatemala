name: Keep Streamlit App Awake

on:
  schedule:
    # Cada 10 minutos
    - cron: '*/10 * * * *'
  workflow_dispatch: # Permite ejecución manual

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    
    steps:
      - name: Ping Streamlit App
        run: |
          echo "🚀 Intentando mantener la app activa..."
          
          # Primer intento con timeout largo y siguiendo redirecciones
          echo "Intento 1..."
          response=$(curl -L -s -o /dev/null -w "%{http_code}" \
            --max-time 60 \
            --retry 2 \
            --retry-delay 5 \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8" \
            -H "Accept-Language: en-US,en;q=0.9" \
            https://dashboard-clima-guatemala-bewnkfyypafure26wqwpxu.streamlit.app/ || echo "000")
          
          echo "📊 Código de respuesta: $response"
          
          if [ "$response" = "200" ] || [ "$response" = "304" ]; then
            echo "✅ App está activa (código: $response)"
            exit 0
          fi
          
          # Si falló, esperar y reintentar
          echo "⏳ App dormida, esperando 45 segundos para que despierte..."
          sleep 45
          
          echo "Intento 2..."
          response2=$(curl -L -s -o /dev/null -w "%{http_code}" \
            --max-time 60 \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
            https://dashboard-clima-guatemala-bewnkfyypafure26wqwpxu.streamlit.app/ || echo "000")
          
          echo "📊 Código de respuesta (2do intento): $response2"
          
          if [ "$response2" = "200" ] || [ "$response2" = "304" ]; then
            echo "✅ App despertó exitosamente en segundo intento"
            exit 0
          else
            echo "⚠️ App no respondió después de 2 intentos"
            exit 0  # No fallar el workflow
          fi
