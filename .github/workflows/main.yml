name: Keep App Awake

on:
  schedule:
    # Se ejecuta cada 6 horas (puedes ajustarlo)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit App
        run: curl -I https://dashboard-clima-guatemala-bewnkfvypafure26wqwpxu.streamlit.app/
